<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c1612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Clock">
<title>The Family Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #1c1612; --panel: #2a211a; --brass: #c9a45c; --brass-dim: #8a7040;
  --ink: #efe6d6; --muted: #a89a86; --sahil: #e3b04b; --gargi: #7fb3c9; --face: #241c16;
  --ok: #8fbf7a; --warn: #d9a441; --bad: #d9705a;
  --display: "IM Fell English SC", Georgia, serif; --body: Inter, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--body);
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0; text-align: center; color: var(--brass); }
.conn { text-align: center; color: var(--muted); font-size: .85rem; margin-top: -10px; display: flex; gap: 8px; justify-content: center; align-items: center; }
.conn .dot { width: 8px; height: 8px; }
svg { width: 100%; max-width: 460px; height: auto; display: block; margin: 0 auto; }
.people { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: var(--panel); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.who { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.st { font-family: var(--display); font-size: 1.4rem; margin-top: 4px; }
.why { color: var(--muted); font-size: .8rem; margin-top: 2px; overflow-wrap: anywhere; }
.log { background: var(--panel); border-radius: 10px; padding: 12px 14px; }
.log h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.log ol { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.log li { display: grid; grid-template-columns: 4.6rem 3.6rem 1fr; gap: 8px; }
.log .t { font-variant-numeric: tabular-nums; color: var(--muted); }
.log .empty { color: var(--muted); display: block; }
.setup { background: var(--panel); border-radius: 10px; padding: 16px; display: none; }
.setup p { margin: 0 0 8px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Family Clock</h1>
  <div class="conn"><span class="dot" id="connDot" style="background:var(--warn)"></span><span id="connText">Connecting…</span></div>

  <svg viewBox="-200 -200 400 400" role="img" aria-label="Clock face with hands for Sahil and Gargi">
    <circle r="190" fill="#3a2a1c"/>
    <circle r="182" fill="var(--brass-dim)"/>
    <circle r="176" fill="var(--face)"/>
    <g id="labels"></g>
    <g id="handG"><line x1="0" y1="18" x2="0" y2="-118" stroke="var(--gargi)" stroke-width="7" stroke-linecap="round"/><circle cy="-128" r="13" fill="var(--gargi)"/><text y="-123.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1612" font-family="Inter, sans-serif">G</text></g>
    <g id="handS"><line x1="0" y1="18" x2="0" y2="-92" stroke="var(--sahil)" stroke-width="9" stroke-linecap="round"/><circle cy="-100" r="13" fill="var(--sahil)"/><text y="-95.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1612" font-family="Inter, sans-serif">S</text></g>
    <circle r="10" fill="var(--brass)"/>
  </svg>

  <div class="people">
    <div class="card"><div class="who"><span class="dot" style="background:var(--sahil)"></span>Sahil</div><div class="st" id="sahilSt">…</div><div class="why" id="sahilWhy"></div></div>
    <div class="card"><div class="who"><span class="dot" style="background:var(--gargi)"></span>Gargi</div><div class="st" id="gargiSt">…</div><div class="why" id="gargiWhy"></div></div>
  </div>

  <div class="log">
    <h2>Changes since you opened this</h2>
    <ol id="log"><li class="empty">Nothing yet. Hands move the moment the brain sees a change.</li></ol>
  </div>

  <div class="setup" id="setup">
    <p>This link is missing its key. Open the full link Sahil sent you (it ends with <code>#u=…&amp;p=…</code>).</p>
  </div>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const BROKER = "wss://re12d02f.ala.us-east-1.emqxsl.com:8084/mqtt";
// Eight positions, 45 degrees apart. Keep in step with CLOCK_FACE in brain\brain.py.
const FACE = { "Home": 12, "Travelling": 1.5, "Work": 3, "Visiting": 4.5,
               "Owl Post Only": 6, "Lost": 7.5, "Mortal Peril": 9, "Away": 10.5 };
const PEOPLE = { sahil: { hand: "handS", name: "Sahil" }, gargi: { hand: "handG", name: "Gargi" } };

// Dial
const labels = document.getElementById("labels");
for (const [name, hour] of Object.entries(FACE)) {
  const a = hour * 30 * Math.PI / 180, r = 146 - 14 * Math.abs(Math.sin(hour * 30 * Math.PI / 180));
  // Long names go on two lines ("Owl Post" / "Only", "Mortal" / "Peril")
  const words = name.split(" "), lines = name.length > 10 ? [words.slice(0, -1).join(" "), words.at(-1)] : [name];
  const x = Math.sin(a) * r, y = -Math.cos(a) * r + 6 - (lines.length - 1) * 8;
  labels.insertAdjacentHTML("beforeend",
    `<line x1="${Math.sin(a)*168}" y1="${-Math.cos(a)*168}" x2="${Math.sin(a)*176}" y2="${-Math.cos(a)*176}" stroke="var(--brass)" stroke-width="3"/>` +
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${name.length > 8 ? 16 : 19}" fill="var(--brass)" font-family="'IM Fell English SC', Georgia, serif">` +
    lines.map((l, i) => `<tspan x="${x}" dy="${i ? 16 : 0}">${l}</tspan>`).join("") + `</text>`);
}

// State per person. Hands start at Lost-free neutral (Home) and swing once data arrives.
const state = {};
for (const k in PEOPLE) state[k] = { status: null, why: "", at: null, angle: 0, target: 0, seenFirst: false };

function fmtTime(epoch) {
  const d = new Date(epoch * 1000), now = new Date();
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? t : d.toLocaleDateString([], { weekday: "short" }) + " " + t;
}
function cleanWhy(why) { return (why || "").replace(/\s*\(fix [^)]*\)\s*$/, ""); }

function render(user) {
  const s = state[user];
  document.getElementById(user + "St").textContent = s.status || "…";
  const bits = [];
  if (s.at) bits.push("since " + fmtTime(s.at));
  if (s.why) bits.push(cleanWhy(s.why));
  document.getElementById(user + "Why").textContent = bits.join(" · ");
}

function setStatus(user, status, why, at, live) {
  const s = state[user];
  const changed = s.status !== null && s.status !== status;
  if (status === s.status && at === s.at) return;
  s.status = status; s.why = why ?? s.why; s.at = at ?? s.at;
  if (FACE[status] !== undefined) s.target = FACE[status] * 30;
  render(user);
  if (changed && live) addLog(user, status, s.at || Date.now() / 1000);
}

const logEl = document.getElementById("log");
function addLog(user, status, at) {
  const empty = logEl.querySelector(".empty"); if (empty) empty.remove();
  logEl.insertAdjacentHTML("afterbegin",
    `<li><span class="t">${fmtTime(at)}</span><span>${PEOPLE[user].name}</span><span>${status}</span></li>`);
  if (navigator.vibrate) navigator.vibrate(60);
}

// Hand animation, short way round
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame() {
  for (const k in PEOPLE) {
    const s = state[k];
    const d = ((s.target - s.angle + 540) % 360) - 180;
    s.angle = reduce || Math.abs(d) < 0.05 ? s.target : s.angle + d * 0.08;
    document.getElementById(PEOPLE[k].hand).setAttribute("transform", `rotate(${s.angle})`);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Refresh "since" labels (Today vs weekday) every minute
setInterval(() => { for (const k in PEOPLE) render(k); }, 60000);

// Connection
const dot = document.getElementById("connDot"), text = document.getElementById("connText");
function conn(color, msg) { dot.style.background = `var(--${color})`; text.textContent = msg; }

const params = new URLSearchParams(location.hash.slice(1));
const user = params.get("u"), pass = params.get("p");
if (!user || !pass) {
  conn("bad", "No key in this link");
  document.getElementById("setup").style.display = "block";
} else {
  const client = mqtt.connect(BROKER, {
    username: user, password: pass,
    clientId: "web-" + Math.random().toString(16).slice(2, 10),
    clean: true, reconnectPeriod: 3000, connectTimeout: 15000, keepalive: 30,
  });
  let ready = false;
  client.on("connect", () => {
    conn("ok", "Live");
    client.subscribe(["weasley/sahil", "weasley/gargi", "weasley/sahil/info", "weasley/gargi/info"], { qos: 1 });
    // Retained messages arrive first; anything after this short window counts as a live change.
    setTimeout(() => { ready = true; }, 3000);
  });
  client.on("reconnect", () => conn("warn", "Reconnecting…"));
  client.on("offline", () => conn("warn", "Offline, retrying…"));
  client.on("error", (e) => {
    const m = String(e && e.message || e);
    conn("bad", /auth|password|Not authorized|Bad user/i.test(m) ? "Login refused, check the link" : "Error: " + m);
  });
  client.on("message", (topic, payload) => {
    const parts = topic.split("/"), who = parts[1];
    if (!PEOPLE[who]) return;
    const body = payload.toString();
    if (parts[2] === "info") {
      try { const j = JSON.parse(body); setStatus(who, j.status, j.why, j.at, ready); } catch {}
    } else if (parts.length === 2) {
      // Plain status (what the hardware clock uses). Keep any detail we already have.
      setStatus(who, body.trim(), state[who].status === body.trim() ? undefined : "", state[who].status === body.trim() ? undefined : (ready ? Date.now() / 1000 : null), ready);
    }
  });
  // Phones suspend background tabs: reconnect promptly when the page comes back.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !client.connected) client.reconnect();
  });
}
</script>
</body>
</html>
